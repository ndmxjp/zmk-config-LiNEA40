draw_config:
  dark_mode: auto
  n_columns: 2
  separate_combo_diagrams: true
  combo_diagrams_scale: 3
  append_colon_to_layer_header: false
  footer_text: LiNEA40 -- macOS / US layout.  Generated from config/LiNEA40.keymap by keymap-drawer.
parse_config:
  modifier_fn_map:
    left_ctrl: ⌃
    right_ctrl: ⌃
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⌥
    right_alt: ⌥
    left_gui: ⌘
    right_gui: ⌘
    keycode_combiner: '{mods}{key}'
    mod_combiner: '{mod_1}{mod_2}'
    special_combinations: {}
  raw_binding_map:
    '&mkp MB1': Click L
    '&mkp MB2': Click R
    '&mkp MB3': Click M
    '&mkp MB4': Back
    '&mkp MB5': Fwd
    '&bootloader': Boot
    '&studio_unlock': Studio
  zmk_keycode_map:
    EXCLAMATION: '!'
