manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: inorichi
      url-base: https://github.com/inorichi
    - name: caksoylar
      url-base: https://github.com/caksoylar
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.2.1
      import: app/west.yml
    # Pinned to a commit because this repo publishes no tags. Tracking main
    # meant the trackball's behaviour could change under us without a commit
    # here -- and this keymap leans on the specifics: automouse-layer only
    # refreshes while the mode is MOVE, scroll-layers and snipe-layers compare
    # against the highest active layer only.
    - name: zmk-pmw3610-driver
      remote: inorichi
      revision: 1d9c2c68ca76012e1b1e5f6ef02fa5eadc4ca399
    # v0.3-branch is a branch and can move; the v0.3 tag is the same commit and
    # cannot.
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
  self:
    path: config
